<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Learn tic-tac-toe across 2D, 3D, 4D and infinite dimensions.">
  <title>Infinite Dimensional Tic-Tac-Toe</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
<main class="app">
  <header class="app-header"><h1 id="gameTitle">Infinite Dimensional Tic-Tac-Toe</h1></header>
  <nav class="mode-bar panel" id="modeBar" aria-label="Start a game in a selected dimension">
    <button type="button" data-mode="2d">2D</button>
    <button type="button" data-mode="3d">3D</button>
    <button type="button" data-mode="4d">4D</button>
    <button type="button" data-mode="inf">∞D</button>
  </nav>
  <div class="upper" id="upperScroll">
    <section class="panel history-panel" aria-label="Move history">
      <h2>Move history</h2>
      <div class="history-scroller" id="historyScroller" tabindex="0" aria-label="Scrollable move history">
        <div class="history-table" id="historyTable"></div>
        <div class="history-status" aria-live="polite">
          <div id="turnStatus" class="turn-status">X to move</div>
          <div id="threatStatus" class="threat-status"></div>
          <div id="errorStatus" class="error-status"></div>
        </div>
      </div>
    </section>
    <section class="panel guide-and-radial" aria-label="Tutorial and read-only game visualization">
      <div class="guide-area" id="guideArea">
        <div class="guide-heading" id="guideHeading">Learn the classic game</div>
        <div class="guide-body" id="guideBody"></div>
      </div>
      <div class="radial-area">
        <svg id="gameSvg" viewBox="0 0 180 172" role="img" aria-label="Read-only board diagram"></svg>
      </div>
    </section>
  </div>
  <div class="bottom-dock">
    <section class="panel entry-panel" aria-label="Enter move using the coordinate keypad">
      <h2>Enter move</h2>
      <div class="field-grid finite" id="fieldGrid">
        <div class="field-group">
          <div class="field-heading">
            <label id="whiteCaption" for="whiteSelect">1st and 2nd Dimensions</label>
            <span id="coordCount" class="coordinate-count">0 of 2</span>
          </div>
          <button type="button" id="whiteSelect" class="digit-field selected" aria-pressed="true"><span id="whiteValue">Use the keypad below</span></button>
        </div>
        <div class="field-group" id="yellowGroup" hidden>
          <div class="field-heading"><label for="yellowSelect">Infinite Repeating Dimensions</label></div>
          <button type="button" id="yellowSelect" class="digit-field repeating"><span id="yellowValue">Tap to enter</span></button>
        </div>
      </div>
      <div class="keypad" role="group" aria-label="Coordinate keypad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" id="deleteBtn">Delete</button>
      </div>
      <button type="button" id="goButton" class="go-button" disabled>Go</button>
    </section>
  </div>
</main>
</body>
</html>
